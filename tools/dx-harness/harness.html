  patch relies on, each checked against AionCore v0.2.2 source, and records every call in
  window.__calls so a test can assert what the loop sent and where.

  Query options:
    ?theme=dark     dark theme
    ?open=1         open the loop menu after load (screenshot use)
    ?on=1           start with the loop armed (screenshot use)
    ?team=1         team page: #/team/team1 with two member columns, data-slot-id slotA (leader,

                    (every other load stands in for a machine that has been through it)

    ?plugins=1      window.aiondxPlugins (patch 0009's claude plugin commands): one plugin installed, four offered
    ?sends=1        Enter in a message box sends the way AionUi does (unless something prevented it): the
                    solo chat's messages route, the lead's team route, a member's agent route; the box

      try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) { body = opts.body; }
      window.__calls.push({ method: method, path: path, url: String(url), body: body });
      if (path === '/api/settings/client' && !noStore) {
        if (method === 'PUT') {
          Object.keys(body || {}).forEach(function (k) { if (body[k] === null) delete store[k]; else store[k] = body[k]; });
          return json(200, { success: true });
        }
        var km = /[?&]keys=([^&]*)/.exec(String(url));
        var keys = km ? decodeURIComponent(km[1]).split(',') : Object.keys(store);
        var out = {};
        keys.forEach(function (k) { if (k in store) out[k] = store[k]; });
        return json(200, { success: true, data: out });
      }
      var m;
      if (method === 'POST' && (m = path.match(/^\/api\/conversations\/([^/]+)\/messages$/)) && body) recordSent(m[1], body.content);
      if (method === 'POST' && (m = path.match(/^\/api\/teams\/[^/]+\/agents\/([^/]+)\/messages$/)) && body) recordSent(slotConv[m[1]], body.content);
      if (method === 'POST' && /^\/api\/teams\/[^/]+\/messages$/.test(path) && body) {
        recordSent('convA', body.content);
        var lead = routes['GET /api/teams/team1/run-state'].data.slot_work[0];
        if (lead.state === 'running') lead.queued_foreground_count = (lead.queued_foreground_count || 0) + 1;
      }
      var hit = routes[method + ' ' + path];
      return Promise.resolve(new Response(JSON.stringify(hit || { success: false }), {
        status: hit ? 200 : 404, headers: { 'Content-Type': 'application/json' }
      }));
    };
  })();
</script>

  <script>

    // member columns. The tab in front is localStorage team-active-slot-team1 (?front=slotB puts the worker there).
    if (window.__team && new URLSearchParams(location.search).get('single') === '1') {
      window.__team = false;
      var front = new URLSearchParams(location.search).get('front');
      if (front) localStorage.setItem('team-active-slot-team1', front); else localStorage.removeItem('team-active-slot-team1');

    if (window.__team) {
      var solo = document.getElementById('solo');
      var team = document.createElement('div');
      team.className = 'team';
      [['slotA', 'leader', 'Lead (running in the stub)'], ['slotB', 'member', 'Worker (idle in the stub)']].forEach(function (c) {
        var col = document.createElement('div');
        col.className = 'col';
        col.setAttribute('data-slot-id', c[0]);
        col.setAttribute('data-role', c[1]);
        var name = document.createElement('div');
        name.className = 'colname';
        name.textContent = c[2];
        col.appendChild(name);
        var copy = solo.cloneNode(true);
        copy.removeAttribute('id');
        var hdr = copy.querySelector('.hdr');
        var picker = hdr.querySelector('[data-testid="acp-model-selector"]');
        var box = document.createElement('div');
        box.className = 'lane-picker';

        hdr.appendChild(more);
        // A message of yours the member has not reached yet (worker column only).
        if (c[0] === 'slotB') {
          var row = document.createElement('div');

      // ?wide=1: columns wider than the window, so the team view scrolls sideways, plus what

        arrow.textContent = '>';

  <script>
    // The draft-queue button, as AionUi's own onClick (bubble phase): window.__draftAdds counts what it queued.
    document.addEventListener('click', function (ev) {
      if (ev.target && ev.target.closest && ev.target.closest('[data-testid="sendbox-add-to-draft-btn"]') && !ev.defaultPrevented) window.__draftAdds = (window.__draftAdds || 0) + 1;
    });
    // ?sends=1: AionUi's own send on Enter, after the patch's capture-phase handlers have had their say.
    if (new URLSearchParams(location.search).get('sends') === '1') {
      document.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' || ev.shiftKey || ev.defaultPrevented) return;
        // Ctrl+Enter puts it in the draft queue, as AionUi does (window.__draftAdds counts them).
        if (ev.ctrlKey || ev.metaKey) { ev.preventDefault(); window.__draftAdds = (window.__draftAdds || 0) + 1; return; }
        var ta = ev.target && ev.target.closest ? ev.target.closest('[data-testid="sendbox-input"]') : null;
        if (!ta || !ta.value.trim()) return;
        ev.preventDefault();
        var col = ta.closest('[data-slot-id]');
        var url = !col ? '/api/conversations/harness1/messages'
          : col.getAttribute('data-role') === 'leader' ? '/api/teams/team1/messages'
          : '/api/teams/team1/agents/' + col.getAttribute('data-slot-id') + '/messages';
        var text = ta.value;
        var d = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
        d.set.call(ta, '');
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        fetch(url, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: text }) });
      });
    }
  </script>
